server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/real_estate_crm}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
app:
  jwt:
    # Replace with a strong secret of at least 32 bytes before deployment.
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value-123456}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:admin@crm.local}
    admin-password: ${ADMIN_PASSWORD:ChangeMe123!}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
